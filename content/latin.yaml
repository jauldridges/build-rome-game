# Condenda Roma: all Latin text for the game lives here, never in code.
# Entries marked approved were proofread by J. Sullivan. Entries marked draft have NOT been proofread (none at present).
# Student-facing builds show only review_status: approved. Add ?drafts=1 to the address to see drafts.
#
# spec_node_id holds the main node from latin1-spec.yaml that the item practices.
# Where an item also practices other nodes, they are listed in a comment on that entry.
# Vocabulary words are 'unmapped': the spec treats headwords as their own items (strand VO),
# so they have no node. Per the design file, unmapped items are listed for review.
#
# After editing this file, run:  python3 tools/build_content.py
# (it rewrites content/latin.js, which the game reads).

