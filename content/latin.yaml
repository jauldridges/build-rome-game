- id: culture_romulus_remus
  latin: "Rōmulus et Remus"
  english: "According to legend, Romulus and Remus were twin sons of the war god Mars. As babies they were left by the river Tiber and raised by a she-wolf. When they grew up, they decided to found a city but quarreled over where: Romulus chose the Palatine Hill, Remus the Aventine. In the best-known version of the story, Remus mocked his brother's new wall by jumping over it, and Romulus killed him in anger. Romulus then named the city Rome after himself. The Romans dated the founding to 753 BCE."
  type: culture_note
  nle_category: culture
  spec_node_id: RW-007
  review_status: approved

- id: culture_pomerium
  latin: "Pōmērium"
  english: "Romulus is said to have marked out his city by plowing a furrow around the Palatine Hill. The sacred boundary of a Roman city became known as the pōmērium. Roman law and religion treated the space inside it differently: for example, a general's military command did not extend across it, and burials were not allowed within it. As Rome grew, the pōmērium was later moved outward."
  type: culture_note
  nle_category: culture
  spec_node_id: unmapped
  review_status: approved

- id: culture_sabine_women
  latin: "Sabīnae fēminae"
  english: "The legend says early Rome had too few women. Romulus invited the neighboring Sabines to a festival, and the Romans carried off the young Sabine women. The Sabines went to war to get them back. When the armies met, the Sabine women ran between them and begged their fathers and their new husbands to stop. Both sides laid down their weapons."
  type: culture_note
  nle_category: culture
  spec_node_id: unmapped
  review_status: approved

- id: culture_tatius
  latin: "Titus Tatius et Rōmulus"
  english: "After the peace, the Romans and the Sabines became one people, and the Sabine king Titus Tatius shared the rule of the city with Romulus. According to the tradition, Tatius died a few years later, and Romulus ruled alone again. Rome's later story kept this memory of two peoples joined into one."
  type: culture_note
  nle_category: culture
  spec_node_id: RW-009
  review_status: approved

