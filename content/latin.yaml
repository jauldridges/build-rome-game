# Condenda Roma: all Latin text for the game lives here, never in code.
# Every entry is a DRAFT. Nothing is approved until it has been proofread line by line.
# spec_node_id is 'unmapped' until latin1-spec.yaml is available.
#
# Questions to settle while proofreading:
#  1. Commands use the singular imperative (Collige, Aedificā, Ambulā), as in the design file,
#     so the player speaks as one foreman to the group. A group of farmers would strictly be
#     Colligite, Aedificāte, Ambulāte. Keep singular, or switch?
#  2. lapis: the command takes the accusative lapidem, a form students may not have met.
#     Keep it, or gloss it on first appearance?
#  3. Nominative vs accusative: labels show lignum / lapis / aqua / casa / mūrus / porta,
#     while orders use lignum / lapidem / aquam / casam / mūrum / portam.
#  4. forum: nominative and accusative are identical, so its order reads the same either way.

