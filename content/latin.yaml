# ---- Rōmulus's opening messages (proofread and approved by J. Sullivan) ----
# English lines are plain translations of the Latin.

- id: name_romulus
  latin: "Rōmulus"
  english: "Romulus"
  type: ui_label
  nle_category: culture
  spec_node_id: unmapped
  review_status: approved

- id: cmd_relege
  latin: "Relege"
  english: "Read it again!"
  type: order
  nle_category: morphosyntax
  spec_node_id: MS-077
  review_status: approved

- id: msg_romulus_intro
  latin: "Salvē, amīce. Sum Rōmulus, rēx prīmus. Oppidum aedificēmus. Adiuvā mē."
  english: "Hello, friend. I am Romulus, the first king. Let us build a town. Help me."
  type: message
  nle_category: morphosyntax
  spec_node_id: MS-040   # also practices MS-041 (predicate nominative), MS-049 (vocative amīce), MS-050 (Adiuvā)
  review_status: approved

- id: msg_romulus_stone
  latin: "Bene! Collige lapidem."
  english: "Good! Gather stone."
  type: message
  nle_category: morphosyntax
  spec_node_id: MS-077
  review_status: approved

- id: msg_romulus_house
  latin: "Bene! Aedificā casam."
  english: "Good! Build a house."
  type: message
  nle_category: morphosyntax
  spec_node_id: MS-050
  review_status: approved

- id: msg_romulus_done
  latin: "Optimē! Casa bona est."
  english: "Excellent! The house is good."
  type: message
  nle_category: morphosyntax
  spec_node_id: MS-042   # also MS-041: adjective bona agrees with casa
  review_status: approved

- id: msg_romulus_relege
  latin: "Relege."
  english: "Read it again."
  type: message
  nle_category: morphosyntax
  spec_node_id: MS-077
  review_status: approved

