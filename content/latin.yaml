# ---- Arrival notices ----
# The singular line is J. Sullivan's text and is approved. The plural line was drafted by the assistant and needs proofreading:
#  1. "Trēs agricolae novī adveniunt." Macrons on trēs and novī. Is the number fine here as exposure?

- id: msg_farmer_arrives
  latin: "Agricola novus advenit."
  english: "A new farmer arrives."
  type: message
  nle_category: morphosyntax
  spec_node_id: MS-074   # also MS-042 (novus agrees with agricola), MS-022
  review_status: approved

- id: msg_farmers_arrive
  latin: "Trēs agricolae novī adveniunt."
  english: "Three new farmers arrive."
  type: message
  nle_category: morphosyntax
  spec_node_id: MS-074   # also MS-020 (nominative plural), MS-044 (adjective agreement, number)
  review_status: draft

