# The fact map for Mission 1. Every factual claim the game makes, the source for it, and whether a person has checked that source.
#
#   id:        short name for the claim
#   claim:     the claim in plain words
#   game:      the game lines it appears in (ids in ../content/latin.yaml)
#   kind:      tradition (what the Romans said happened) | archaeology | language | etymology | date | scholarship | gameplay (a rule of the game, not history)
#   sources:   where to read it. type is primary (an ancient author) or secondary (a modern scholar)
#   confidence: how sure Claude is that the citation points at the right passage (high | medium | low). Claude cites from memory.
#   verified:  false until a person has read the passage and confirmed it says this. Then set to true and fill in checked_by.
#   note:      anything to remember when teaching it (other versions of the story, wording to watch)
#
# Translations: Perseus (perseus.tufts.edu) hosts older public-domain English translations of Livy, Plutarch and Dionysius
# of Halicarnassus. Check which translation you quote and whether it is free to reuse.

# ---- culture_romulus_remus ----
- id: twins_sons_of_mars
  claim: Romulus and Remus were twins, and their father was said to be Mars, the god of war.
  game: [culture_romulus_remus, cq_romulus_remus]
  kind: tradition
  sources:
    - { type: primary, work: Livy, ref: "Ab Urbe Condita 1.4.1-3", say: "Rhea Silvia bears twins and names Mars as the father" }
    - { type: primary, work: Plutarch, ref: "Life of Romulus 3-4" }
    - { type: primary, work: Dionysius of Halicarnassus, ref: "Roman Antiquities 1.77" }
  confidence: medium
  verified: false
  note: "Livy says she CLAIMED Mars was the father ('whether she believed it or to excuse the fault'), so 'said to be' is safer than 'were'."

- id: great_uncle_amulius
  claim: Their great-uncle (Amulius) tried to have them killed and left them by the river as babies.
  game: [culture_romulus_remus]
  kind: tradition
  sources:
    - { type: primary, work: Livy, ref: "1.3.10-1.4.5", say: "Amulius orders the babies thrown into the Tiber; the servant leaves them in the flood shallows" }
    - { type: primary, work: Plutarch, ref: "Life of Romulus 3.4-4.1" }
  confidence: medium
  verified: false
  note: "Amulius is the brother of Numitor (the twins' grandfather), so great-uncle is right. In Livy the servants set them down by a flooded Tiber rather than throwing them in."

- id: she_wolf_raised_them
  claim: A she-wolf found the twins and nursed them, and they were later raised by a shepherd.
  game: [culture_romulus_remus]
  kind: tradition
  sources:
    - { type: primary, work: Livy, ref: "1.4.6-1.4.7", say: "a thirsty she-wolf comes to the babies' crying and nurses them" }
    - { type: primary, work: Plutarch, ref: "Life of Romulus 4.1-4.2" }
  confidence: medium
  verified: false
  note: "The game says 'a friendly mama wolf took them into her cave'. Livy has a note that 'lupa' may also mean a woman (the shepherd's wife, Larentia). The cave (the Lupercal) is named in Livy 1.5.2 and in Dionysius 1.79; check which passage you want to cite for the cave."

- id: decided_to_found_city
  claim: When grown, the brothers decided to found a city where they had been left and raised.
  game: [culture_romulus_remus]
  kind: tradition
  sources:
    - { type: primary, work: Livy, ref: "1.6.3-1.6.4" }
  confidence: medium
  verified: false

- id: hill_dispute
  claim: The brothers disagreed about which hill the city should be on (Romulus the Palatine, Remus the Aventine).
  game: [culture_romulus_remus]
  kind: tradition
  sources:
    - { type: primary, work: Livy, ref: "1.6.4-1.7.1", say: "they dispute and decide by taking omens from birds" }
    - { type: primary, work: Plutarch, ref: "Life of Romulus 9.4" }
  confidence: medium
  verified: false
  note: "Livy: Romulus chose the Palatine, Remus the Aventine, and they took the auspices to settle it. The game's text only says they disagreed."

- id: remus_mocked_wall_killed
  claim: Romulus began to build a wall; Remus made fun of it (jumping over it); Romulus killed him.
  game: [culture_romulus_remus, msg_remus_wall, msg_romulus_remus, msg_romulus_remus_gone]
  kind: tradition
  sources:
    - { type: primary, work: Livy, ref: "1.7.2", say: "Remus jumps over the new wall in mockery; Romulus kills him in anger" }
    - { type: primary, work: Plutarch, ref: "Life of Romulus 10.1" }
  confidence: medium
  verified: false
  note: "Versions differ. Livy gives this one first, then another version in which Remus dies in a fight over the omens. In Plutarch (and in Dionysius) it is Celer, Romulus's man, who kills Remus. The card says Romulus killed him 'out of spite'; Livy's word is 'in anger' (iratus)."

- id: named_rome_after_himself
  claim: Romulus named the city Rome after himself.
  game: [culture_romulus_remus]
  kind: tradition
  sources:
    - { type: primary, work: Livy, ref: "1.6.4 and 1.7.3" }
    - { type: primary, work: Plutarch, ref: "Life of Romulus 9.4" }
  confidence: low
  verified: false
  note: "Low confidence on the exact section number. Check Livy 1.6.4: the city is said to be named after Romulus. Plutarch Romulus 1.1-2 also discusses other explanations for the name."

- id: founding_date_753
  claim: The Romans dated the founding to 753 BCE.
  game: [culture_romulus_remus, culture_story_history]
  kind: date
  sources:
    - { type: primary, work: Varro (as reported by Censorinus), ref: "De die natali 21.6" }
    - { type: primary, work: Plutarch, ref: "Life of Romulus 12.3-4" }
    - { type: primary, work: Dionysius of Halicarnassus, ref: "Roman Antiquities 1.74-75" }
  confidence: low
  verified: false
  note: "753 BCE is the date worked out by the scholar Varro (1st century BCE). Other ancient writers gave nearby dates (Dionysius is a year or two off), so 'according to the Romans' is the right wording; I'm not certain of the section numbers. The traditional day is 21 April."
