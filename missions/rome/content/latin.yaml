- id: culture_romulus_remus
  latin: "Rōmulus et Remus"
  english: "The Ancient Romans had some wild stories about their city's founding. Romulus and Remus were twins, the sons of Mars, god of war. Their great uncle tried to kill them and left them by the river to die right after they were born. A friendly mama wolf took them into her cave and raised them. They grew up and wanted to start a new city. The brothers disagreed which hill should be the home base of the city. Romulus started to build a wall; Remus made fun of it; and Romulus killed him out of spite. Then he named the city Rome, after himself. According to the Romans, this happened in 753 B.C."
  type: culture_note
  nle_category: culture
  spec_node_id: RW-007
  review_status: approved
  en_title: "Romulus and Remus"
  en_status: approved

- id: culture_pomerium
  latin: "Pōmērium"
  english: "Romulus is said to have marked out his city by plowing a furrow around the Palatine Hill. The sacred boundary of a Roman city became known as the pōmērium. Roman law and religion treated the space inside it differently: for example, a general's military command did not extend across it, and burials were not allowed within it. As Rome grew, the pōmērium was later moved outward."
  type: culture_note
  nle_category: culture
  spec_node_id: unmapped
  review_status: approved
  en_title: "The Pomerium"
  en_status: approved

- id: culture_sabine_women
  latin: "Sabīnae fēminae"
  english: "The legend says early Rome had too few women. Romulus invited the neighboring Sabines to a festival, and the Romans carried off the young Sabine women. The Sabines went to war to get them back."
  type: culture_note
  nle_category: culture
  spec_node_id: unmapped
  review_status: approved
  en_title: "The Sabine Women"
  en_status: approved

- id: culture_sabine_women_end
  latin: "Sabīnae fēminae"
  english: "When the armies met, the Sabine women ran between them and begged their fathers and their new husbands to stop. Both sides laid down their weapons."
  type: culture_note
  nle_category: culture
  spec_node_id: unmapped
  review_status: approved
  en_title: "The Sabine Women"
  en_status: approved

- id: culture_tatius
  latin: "Titus Tatius et Rōmulus"
  english: "After the peace, the Romans and the Sabines became one people, and the Sabine king Titus Tatius shared the rule of the city with Romulus. According to the tradition, Tatius died a few years later, and Romulus ruled alone again. Rome's later story kept this memory of two peoples joined into one."
  type: culture_note
  nle_category: culture
  spec_node_id: RW-009
  review_status: approved
  en_title: "Titus Tatius and Romulus"
  en_status: approved

# ---- Fuller history cards (proofread and approved by J. Sullivan) ----
# More historical context: the setting, who the Sabines were, why they fought Rome, and what came next.

- id: culture_hills
  latin: "Septem collēs"
  english: "Rome grew up on the Tiber river, about fifteen miles (25 km) from the sea, among low hills that the Romans later counted as seven: the Palatine, Capitoline, Quirinal, Viminal, Esquiline, Caelian and Aventine. The hills were easy to defend, and a crossing of the river and an old route that carried salt from the coast ran close by. Archaeologists have found traces of huts on the Palatine from about the 8th century BCE, not far from the date the Romans gave for the founding."
  type: culture_note
  nle_category: culture
  spec_node_id: RW-001   # also RW-005
  review_status: approved
  en_title: "The Seven Hills"
  en_status: approved

- id: culture_asylum
  latin: "Asylum"
  english: "A new town needs people. According to the Roman historian Livy, Romulus set aside a place of refuge, an asylum, and welcomed anyone from the neighboring lands who wanted a fresh start, whether free or enslaved. The crowd that came was mostly men. The Romans themselves told this story because they were proud that Rome had always grown by taking in newcomers."
  type: culture_note
  nle_category: culture
  spec_node_id: RW-007
  review_status: approved
  en_title: "A Place of Refuge"
  en_status: approved

- id: culture_sabines
  latin: "Sabīnī"
  english: "The Sabines were a people of central Italy who lived in the hills northeast of Rome, only a day or two away on foot. They were farmers and herders who spoke their own Italic language, related to Latin, and they worshiped many of the same gods. The Romans remembered that some of their own customs came from the Sabines: the god Quirinus, for example, and Numa Pompilius, their second king. Some great Roman families, like the Claudii, claimed Sabine ancestors. Over the following centuries Rome fought the Sabines many times, and by about 290 BCE they had become part of the Roman state."
  type: culture_note
  nle_category: culture
  spec_node_id: RW-006
  review_status: approved
  en_title: "The Sabines"
  en_status: approved

- id: culture_why_war
  latin: "Cūr bellum?"
  english: "Why would the Sabines go to war with a new town? In the legend, Rome had men but few women, so Romulus sent messengers to the neighboring peoples asking for the right to marry their daughters. The neighbors refused. Some looked down on the newcomers, and others feared that this fast-growing town would soon be too strong to stop. Behind the story lies a real situation: small neighboring communities in early Italy competed for land, pasture and power, and they often fought and then joined together."
  type: culture_note
  nle_category: culture
  spec_node_id: unmapped
  review_status: approved
  en_title: "Why War?"
  en_status: approved

- id: culture_senate
  latin: "Senātus"
  english: "The Romans believed that Romulus chose one hundred elders to advise him, and called them patrēs, “fathers.” The word senātus comes from senex, “old man,” so the Senate was a council of elders. The families that descended from these fathers were later called patricians. Tradition also said that Romulus divided the people into three tribes, and that the names of two of them were linked to Romulus himself and to Titus Tatius. These stories show how the Romans saw themselves: a people made up of more than one community."
  type: culture_note
  nle_category: culture
  spec_node_id: RW-016   # also RW-022 (patricians)
  review_status: approved
  en_title: "The Senate"
  en_status: approved

- id: culture_kings
  latin: "Septem rēgēs"
  english: "Romulus was the first of seven kings. His successor, Numa Pompilius, was said to be a Sabine and was remembered as a peaceful priest-king. The last king, Tarquinius Superbus, was driven out in 509 BCE, and the Romans founded a republic. They never lost their hatred of the word rēx, “king.”"
  type: culture_note
  nle_category: culture
  spec_node_id: RW-009   # also RW-011
  review_status: approved
  en_title: "Seven Kings"
  en_status: approved

- id: culture_story_history
  latin: "Fābula et historia"
  english: "Historians do not treat these stories as exact history. Livy and other writers told them more than seven hundred years after the date they give for the founding, using older tales. The evidence suggests that Rome grew gradually from villages on the Tiber hills, as Latins, Sabines and later Etruscans lived side by side and sometimes mixed. The legends are still important: they show what the Romans wanted to believe about themselves, a city that began small, welcomed outsiders and learned to turn enemies into neighbors."
  type: culture_note
  nle_category: culture
  spec_node_id: RW-007
  review_status: approved
  en_title: "Legend and History"
  en_status: approved

