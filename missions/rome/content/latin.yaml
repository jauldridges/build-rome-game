  en_status: approved
  type: message
  nle_category: morphosyntax
  spec_node_id: MS-077   # also MS-084, MS-065
  review_status: approved

# ---- Juice: ranks, optional scrolls, and Remus (proofread and approved by J. Sullivan) ----
# Ranks rise with the city: colōnus (the start), aedificātor (after the wall), dēfēnsor (after the first wave), aedīlis (the end).
# Remus appears when the wall is finished: he says it is small, jumps over it, and wanders off (the legend, played).
# "Remus est dēlendus." is deliberately beyond Latin I (a gerundive, as in Cato's "Carthāgō dēlenda est").

- id: rank_colonus
  latin: "colōnus"
  english: "settler"
  type: ui_label
  nle_category: vocabulary
  spec_node_id: unmapped
  review_status: approved

- id: rank_aedificator
  latin: "aedificātor"
