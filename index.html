<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Condenda Roma</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="panel">
  <div id="res"></div>
  <div id="cmds"></div>
  <div id="orders"></div>
  <div id="clock"><div id="clockfill"></div></div>
  <div id="msg"></div>
  <div id="help">Click a farmer or drag a box around several (A selects all), then choose a command or click a tree, rock or pond. Scroll with the arrow keys or by dragging with the right mouse button (or hold Space and drag).</div>
</div>
<div id="order"></div>
<div id="recent"></div>
<div id="msgbox">
  <div id="mbox">
    <div id="pframe"><img id="portrait" alt=""><div id="placeholder"></div></div>
    <div id="mbody">
      <div id="speaker"></div>
      <div id="mtext"></div>
      <div id="mhint"></div>
      <button id="mok">Continue</button>
    </div>
  </div>
</div>
<div id="tip"></div>
<div id="popup"></div>
<div id="card">
  <div id="cardbox">
    <div id="cardlatin"></div>
    <div id="cardenglish"></div>
    <button id="cardok">Continue</button>
  </div>
</div>
<canvas id="game"></canvas>
<script src="content/latin.js"></script>
<script src="game.js"></script>
<script src="attack.js"></script>
</body>
</html>
