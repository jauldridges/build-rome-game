<title>Fact Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<style>
  /* Layout: one column of claim cards under a sticky progress bar. Each card reads top to bottom: claim, where to look, three big buttons. */
  :root {
    --bg: #f2f4f3; --panel: #ffffff; --ink: #1b2522; --muted: #5d6b66; --line: #d6ddda;
    --accent: #1f6f66; --accent-ink: #ffffff;
    --ok: #2b7a4b; --ok-bg: #e3f2e8; --fix: #a76a0c; --fix-bg: #fbefd6; --no: #b03a2e; --no-bg: #f9e1dd;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #131a18; --panel: #1b2421; --ink: #e6ece9; --muted: #9baba5; --line: #2f3c38;
    --accent: #4fb3a6; --accent-ink: #0c1412;
    --ok: #6fd193; --ok-bg: #1b3326; --fix: #e8b04f; --fix-bg: #3a2c12; --no: #f08a7c; --no-bg: #3b1f1b; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #131a18; --panel: #1b2421; --ink: #e6ece9; --muted: #9baba5; --line: #2f3c38;
    --accent: #4fb3a6; --accent-ink: #0c1412;
    --ok: #6fd193; --ok-bg: #1b3326; --fix: #e8b04f; --fix-bg: #3a2c12; --no: #f08a7c; --no-bg: #3b1f1b; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 64px; }
  .wrap { max-width: 820px; margin: 0 auto; }
  header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; border-bottom: 1px solid var(--line); }
  h1 { font: 600 24px/1.2 var(--serif); margin: 0; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; display: flex; margin: 10px 0 8px; }
  .bar i { display: block; height: 100%; }
  .bar .b-ok { background: var(--ok); } .bar .b-fix { background: var(--fix); } .bar .b-no { background: var(--no); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: 500 13px var(--sans); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .how { margin: 16px 0 6px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; font-size: 15px; display: grid; gap: 4px; }
  .how b { font-weight: 600; }
  .saveflag { font-size: 13px; color: var(--muted); }
  .group { margin-top: 28px; }
  .group h2 { font: 600 20px/1.2 var(--serif); margin: 0 0 6px; }
  details.cardtext { margin: 0 0 12px; }
  details.cardtext summary { cursor: pointer; color: var(--accent); font-size: 14px; }
  details.cardtext p { font: 400 16px/1.6 var(--serif); margin: 8px 0 0; padding: 12px 14px; background: var(--panel); border-left: 3px solid var(--accent); }
  article.claim { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; display: grid; gap: 12px; }
  article.claim[data-status="approved"] { border-color: var(--ok); }
  article.claim[data-status="fix"] { border-color: var(--fix); }
  article.claim[data-status="notfound"] { border-color: var(--no); }
  .claimtop { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .claimtext { font: 600 19px/1.4 var(--serif); margin: 0; text-wrap: balance; min-width: 0; }
  .pill { flex: none; font: 600 12px var(--sans); letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; }
  .pill.todo { background: var(--line); color: var(--muted); }
  .pill.approved { background: var(--ok-bg); color: var(--ok); }
  .pill.fix { background: var(--fix-bg); color: var(--fix); }
  .pill.notfound { background: var(--no-bg); color: var(--no); }
  .label { font: 600 12px var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .src { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
  .src + .src { margin-top: 8px; }
  .srcwork { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .srcwork b { font-weight: 600; }
  .conf { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--line); color: var(--muted); }
  .conf.low { background: var(--no-bg); color: var(--no); } .conf.medium { background: var(--fix-bg); color: var(--fix); } .conf.high { background: var(--ok-bg); color: var(--ok); }
  .srcrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input.ref { flex: 1 1 200px; min-width: 0; font: 400 15px var(--mono); padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
  a.find { font: 500 14px var(--sans); padding: 8px 12px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); text-decoration: none; white-space: nowrap; }
  a.find.alt { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .say { font: italic 400 15px/1.5 var(--serif); color: var(--muted); margin: 0; }
  .note { font-size: 14px; padding: 10px 12px; border-radius: 8px; background: var(--fix-bg); color: var(--ink); }
  .note b { color: var(--fix); }
  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .actions button { font: 600 15px var(--sans); padding: 12px 8px; border-radius: 8px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
  .actions button.ok:hover, .actions button.ok.on { background: var(--ok); border-color: var(--ok); color: #fff; }
  .actions button.fix:hover, .actions button.fix.on { background: var(--fix); border-color: var(--fix); color: #fff; }
  .actions button.no:hover, .actions button.no.on { background: var(--no); border-color: var(--no); color: #fff; }
  .editbox { display: grid; gap: 8px; padding: 12px; border: 1px dashed var(--fix); border-radius: 8px; }
  .editbox textarea { width: 100%; min-height: 64px; font: 400 15px/1.5 var(--sans); padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); resize: vertical; }
  .editbox button.save { justify-self: start; font: 600 15px var(--sans); padding: 10px 18px; border-radius: 8px; border: 0; background: var(--fix); color: #fff; cursor: pointer; }
  .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .reset { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font: 400 13px var(--sans); padding: 0; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .empty { padding: 30px 0; color: var(--muted); text-align: center; }
  @media (max-width: 520px) { .actions { grid-template-columns: 1fr; } .claimtop { flex-direction: column-reverse; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>Fact Check</h1>
    <div class="sub">Condenda Rōma, Mission 1 · <span id="counts"></span> · <span class="saveflag" id="saveflag"></span></div>
    <div class="bar" aria-hidden="true"><i class="b-ok" id="bar-ok"></i><i class="b-fix" id="bar-fix"></i><i class="b-no" id="bar-no"></i></div>
    <div class="chips" id="chips"></div>
  </header>

  <div class="how">
    <div><b>1.</b> Read the claim.</div>
    <div><b>2.</b> Press <b>Find passage</b>. It opens a search for that exact citation in a new tab.</div>
    <div><b>3.</b> Press <b>Looks right</b>, <b>Fix it</b> (change the citation or wording) or <b>Can't find it</b>. Everything saves by itself. When you are done, tell Claude.</div>
  </div>

  <main id="list"></main>
</div>

<script>
/*FACTS*/
var FACTS = __FACTS__;
var GROUPS = __GROUPS__;

var STATUS_LABEL = { todo: "To check", approved: "Verified", fix: "Needs a fix", notfound: "Not found" };
var dec = {};          // id -> saved decision
var filter = "all";
var dbRef = null, canSave = false;

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function statusOf(id) { return (dec[id] && dec[id].status) || "todo"; }

function searchUrl(src, ref) {
  var q = src.work.replace(/\(as reported by [^)]*\)/, "") + " " + ref + " English translation Perseus";
  return "https://www.google.com/search?q=" + encodeURIComponent(q);
}

function render() {
  var counts = { todo: 0, approved: 0, fix: 0, notfound: 0 };
  FACTS.forEach(function (f) { counts[statusOf(f.id)]++; });
  var n = FACTS.length;
  document.getElementById("counts").textContent = (n - counts.todo) + " of " + n + " checked";
  document.getElementById("bar-ok").style.width = (counts.approved / n * 100) + "%";
  document.getElementById("bar-fix").style.width = (counts.fix / n * 100) + "%";
  document.getElementById("bar-no").style.width = (counts.notfound / n * 100) + "%";

  var chips = [["all", "All " + n], ["todo", "To check " + counts.todo], ["approved", "Verified " + counts.approved], ["fix", "Needs a fix " + counts.fix], ["notfound", "Not found " + counts.notfound]];
  document.getElementById("chips").innerHTML = chips.map(function (c) {
    return '<button class="chip" data-filter="' + c[0] + '" aria-pressed="' + (filter === c[0]) + '">' + esc(c[1]) + "</button>";
  }).join("");

  var html = "", shown = 0;
  GROUPS.forEach(function (g) {
    var items = FACTS.filter(function (f) { return f.group === g.id && (filter === "all" || statusOf(f.id) === filter); });
    if (!items.length) return;
    shown += items.length;
    html += '<section class="group"><h2>' + esc(g.title) + "</h2>";
    if (g.text) html += '<details class="cardtext"><summary>Read the card as students see it</summary><p>' + esc(g.text) + "</p></details>";
    items.forEach(function (f) { html += claimHtml(f); });
    html += "</section>";
  });
  document.getElementById("list").innerHTML = shown ? html : '<div class="empty">Nothing here. Pick another filter.</div>';
}

function claimHtml(f) {
  var d = dec[f.id] || {}, st = statusOf(f.id);
  var claim = d.claim || f.claim;
  var h = '<article class="claim" id="c-' + esc(f.id) + '" data-id="' + esc(f.id) + '" data-status="' + st + '">';
  h += '<div class="claimtop"><p class="claimtext">' + esc(claim) + '</p><span class="pill ' + st + '">' + STATUS_LABEL[st] + "</span></div>";
  h += '<div><div class="label">Where to look</div>';
  f.sources.forEach(function (s, i) {
    var ref = (d.refs && d.refs[i] != null) ? d.refs[i] : s.ref;
    h += '<div class="src"><div class="srcwork"><b>' + esc(s.work) + '</b>' + (s.type === "secondary" ? '<span class="conf">modern scholar</span>' : "") + "</div>";
    h += '<div class="srcrow"><input class="ref" data-i="' + i + '" value="' + esc(ref) + '" aria-label="Citation for ' + esc(s.work) + '">';
    h += '<a class="find" target="_blank" rel="noopener" href="' + searchUrl(s, ref) + '">Find passage ↗</a></div>';
    if (s.say) h += '<p class="say">Should say: ' + esc(s.say) + "</p>";
    h += "</div>";
  });
  h += '<div style="margin-top:8px"><span class="conf ' + esc(f.confidence) + '">Claude’s confidence in these citations: ' + esc(f.confidence) + "</span> " +
       '<a class="find alt" target="_blank" rel="noopener" href="https://www.perseus.tufts.edu/hopper/">Open Perseus ↗</a></div></div>';
  if (f.note) h += '<div class="note"><b>Watch for:</b> ' + esc(f.note) + "</div>";
  h += '<div class="actions"><button class="ok' + (st === "approved" ? " on" : "") + '" data-act="approved">✓ Looks right</button>' +
       '<button class="fix' + (st === "fix" ? " on" : "") + '" data-act="fix">✎ Fix it</button>' +
       '<button class="no' + (st === "notfound" ? " on" : "") + '" data-act="notfound">✗ Can’t find it</button></div>';
  if (st === "fix") {
    h += '<div class="editbox"><div class="label">Correct the wording of the claim (optional)</div><textarea class="fclaim" id="claim-' + esc(f.id) + '">' + esc(claim) + "</textarea>" +
         '<div class="label">Your note (optional)</div><textarea class="fnote" id="note-' + esc(f.id) + '" placeholder="What is wrong, or what the passage actually says">' + esc(d.note || "") + "</textarea>" +
         '<button class="save" data-act="savefix">Save fix</button></div>';
  } else if (d.note) {
    h += '<div class="meta"><span>Your note: ' + esc(d.note) + "</span></div>";
  }
  if (st !== "todo") h += '<div class="meta"><span></span><button class="reset" data-act="todo">Undo</button></div>';
  return h + "</article>";
}

function collect(card) {
  var refs = Array.prototype.map.call(card.querySelectorAll("input.ref"), function (i) { return i.value.trim(); });
  var c = card.querySelector(".fclaim"), n = card.querySelector(".fnote");
  return { refs: refs, claim: c ? c.value.trim() : null, note: n ? n.value.trim() : null };
}

var writing = {};
function save(id, patch) {
  var prev = dec[id] || {};
  var next = Object.assign({}, prev, patch, { updatedAt: new Date().toISOString() });
  dec[id] = next;
  render();
  flag(canSave ? "Saving…" : "Not saved (open this page from your Claude link and sign in)");
  if (!canSave) return;
  var run = function () {
    return dbRef.doc("review/" + id).set(dec[id]).then(function () { flag("Saved"); }, function (e) { flag("Could not save: " + (e && e.message || e)); });
  };
  writing[id] = (writing[id] || Promise.resolve()).then(run);
}
function flag(t) { document.getElementById("saveflag").textContent = t; }

document.addEventListener("click", function (e) {
  var chip = e.target.closest(".chip");
  if (chip) { filter = chip.dataset.filter; render(); return; }
  var btn = e.target.closest("[data-act]");
  if (!btn) return;
  var card = btn.closest("article.claim"), id = card.dataset.id, act = btn.dataset.act, v = collect(card);
  if (act === "approved") save(id, { status: "approved", refs: v.refs });
  else if (act === "notfound") save(id, { status: "notfound", refs: v.refs });
  else if (act === "fix") save(id, { status: "fix", refs: v.refs });
  else if (act === "savefix") save(id, { status: "fix", refs: v.refs, claim: v.claim, note: v.note });
  else if (act === "todo") save(id, { status: "todo" });
});
// Fixing a citation in its box is saved as soon as you click away from it
document.addEventListener("change", function (e) {
  if (!e.target.classList.contains("ref")) return;
  var card = e.target.closest("article.claim"), id = card.dataset.id;
  save(id, { refs: collect(card).refs });
});

render();

(async function () {
  try {
    var db = await window.claude.use("db");
    if (!db) { flag("Not saving: open this page from your Claude link and sign in"); return; }
    dbRef = db; canSave = true; flag("Saved decisions load here");
    db.collection("review").onSnapshot(function (snap) {
      var active = document.activeElement;
      snap.docs.forEach(function (d) { if (d.exists) dec[d.id] = d.data(); });
      if (!(active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA"))) render();
      flag("Saved");
    }, function (err) { flag("Could not read saved decisions: " + (err && err.message || err)); });
  } catch (e) { flag("Not saving: " + (e && e.message || e)); }
})();
</script>
